[profile.default]
src = "src"
out = "out"
libs = ["lib", "lib/v4-periphery/lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    '@openzeppelin/=lib/openzeppelin-contracts',
    '@uniswap/v3-core/=lib/v3-core/',
    '@uniswap/v4-core/=lib/v4-core/',
    'v4-core/=lib/v4-core/src/',
    'v4-periphery/=lib/v4-periphery/src/'
]
